[project]
name = "robomme"
version = "0.1.0"
description = "Add your description here"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "mani-skill",
    "opencv-python>=4.11.0.86",
    "setuptools==80.9.0",
    "torch==2.9.1",
    "torchvision==0.24.1",
]

[project.optional-dependencies]
dev = ["opencv-python", "pytest"]

[tool.uv.sources]
mani-skill = { git = "https://github.com/YinpeiDai/ManiSkill.git", rev = "07be6fbc66350ddca200abfb0a11b692f078f7fd" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
server = [
    "dm-tree==0.1.8",
    "flask>=3.1.3",
    "msgpack==1.1.2",
    "websockets==15.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/robomme", "src/robomme_ood"]

[tool.pytest.ini_options]
# robomme_ood tests: the daily gate = the non-slow part of tests/robomme_ood (CPU only; the resource-guard plugin blocks real simulation / CUDA / weights / internet);
# tests/robomme_ood/sim is not collected by default; select it explicitly and run with --allow-sim-reset. Other upstream tests/ directories run by explicit path, as upstream does.
testpaths = ["tests/robomme_ood"]
addopts = "-p tests.robomme_ood._support.resource_policy"
xfail_strict = true
markers = [
    "sim: real simulation reset, used only in tests/robomme_ood/sim",
    "slow: slow-running tests",
    "gpu: tests requiring GPU/display/headless rendering stack",
    "dataset: tests that generate/use temporary datasets",
    "lightweight: tests that do not require generated dataset",
]
